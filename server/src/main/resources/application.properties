game.network.host=127.0.0.1
game.network.port=1707
game.network.transport=LEGACY_TCP
game.network.max-session-per-ip=20
game.network.max-packet-size=262144
game.network.send-queue-size=256
game.network.handshake-timeout-ms=10000
game.network.tls.keystore=
game.network.tls.keystore-type=PKCS12
game.network.tls.keystore-password-env=GAME_TLS_KEYSTORE_PASSWORD
game.network.tls.protocol=TLSv1.3
game.client.version=0.9.5
game.client.login-version=1
game.security.mode=LEGACY_DEV
game.resource.icon-dir=resources/icon
game.resource.image-version=2
game.resource.json-dir=resources/json

# Normal server startup requires the configured account database.
game.db.url=jdbc:mysql://localhost:3306/rongthanchibi
game.db.username=root
game.db.password-env=GAME_DB_PASSWORD
game.db.allow-empty-password=true
game.db.maximum-pool-size=10
game.db.minimum-idle=1
game.db.connection-timeout-ms=5000
